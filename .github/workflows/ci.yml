name: Cabin Atlas CI
on: [push, pull_request]
concurrency:
  group: cabin-atlas-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          TESTING: 'true'
      - run: docker compose up --build --wait --wait-timeout 120
        env:
          SECRET_KEY: ci-only-signing-key-not-for-real-deployment
          CREW_PASSWORD: ci-only-crew-password
      - name: Check production proxies and authentication
        run: |
          python - <<'PYCODE'
          import json, urllib.request, urllib.error
          for port in [5173, 5174]:
              with urllib.request.urlopen(f'http://127.0.0.1:{port}/api/health') as response:
                  assert json.load(response)['status'] == 'ok'
              with urllib.request.urlopen(f'http://127.0.0.1:{port}/') as response:
                  assert b'Cabin Atlas' in response.read()
          request = urllib.request.Request('http://127.0.0.1:5173/api/auth/passenger', data=json.dumps({'seat': '22A', 'booking_reference': 'DEMO'}).encode(), headers={'Content-Type': 'application/json'})
          try:
              urllib.request.urlopen(request)
              raise AssertionError('Production DEMO login must be denied')
          except urllib.error.HTTPError as error:
              assert error.code == 401
          PYCODE
      - name: Diagnose failed production startup
        if: failure()
        run: docker compose logs --no-color --tail=100
        env:
          SECRET_KEY: ci-only-signing-key-not-for-real-deployment
          CREW_PASSWORD: ci-only-crew-password
      - run: docker compose down
        if: always()
        env:
          SECRET_KEY: ci-only-signing-key-not-for-real-deployment
          CREW_PASSWORD: ci-only-crew-password
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        portal: [passenger_screen, crew_dashboard]
    defaults:
      run:
        working-directory: frontend/${{ matrix.portal }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/${{ matrix.portal }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm ci --prefix frontend/crew_dashboard
      - run: npm ci --prefix frontend/passenger_screen
      - run: frontend/crew_dashboard/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
          if-no-files-found: ignore
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt

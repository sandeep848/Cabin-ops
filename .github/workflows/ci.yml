name: CabinOps CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          TESTING: 'true'
      - run: python scripts/evaluate_parser.py
      - run: docker build -t cabinops-api .
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        portal: [passenger_screen, crew_dashboard]
    defaults:
      run:
        working-directory: frontend/${{ matrix.portal }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/${{ matrix.portal }}/package-lock.json
      - run: npm ci
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm ci --prefix frontend/crew_dashboard
      - run: npm ci --prefix frontend/passenger_screen
      - run: frontend/crew_dashboard/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
          if-no-files-found: ignore

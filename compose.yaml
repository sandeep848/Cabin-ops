services:
  backend:
    build: .
    environment:
      ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CREW_USERNAME: ${CREW_USERNAME:-crew}
      CREW_PASSWORD: ${CREW_PASSWORD:?Set CREW_PASSWORD in .env}
      CABINOPS_DB_PATH: /data/cabinops.db
    volumes:
      - cabinops-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [cabin]
    restart: unless-stopped
  passenger:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        PORTAL: passenger_screen
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [cabin, ingress]
    restart: unless-stopped
  crew:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        PORTAL: crew_dashboard
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:5174:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [cabin, ingress]
    restart: unless-stopped
volumes:
  cabinops-data:

networks:
  cabin:
    internal: true
  ingress:
    driver: bridge
